submission:
  title: "Child Online Safety Monitor & Reporting Guide (COSM)"

  problem_statement: >
    Children face escalating online grooming and sexual exploitation, yet parents, teachers, and
    NGO workers lack a fast, accessible tool to identify warning signs, understand their legal
    obligations, and generate a ready-to-submit incident report without inadvertently re-exposing
    harmful content. The gap between detection and formal reporting leaves children at risk.

  solution_summary: >
    COSM is a fully local Streamlit application that accepts a behavioural description or
    anonymised chat excerpt, detects grooming warning signs via pattern analysis, scores risk
    (Low–Critical), maps findings to POCSO Act 2012 and IT Act 2000, provides a 10-step evidence
    preservation guide, and auto-generates a CyberTipline-style incident report downloadable as
    Markdown or PDF — all without storing, transmitting, or re-displaying harmful content.

  key_features:
    - "Grooming pattern detection across 12+ behavioural, communication, and digital signal categories"
    - "Automated risk scoring (0–100) with Low / Medium / High / Critical classification and colour badges"
    - "Legal mapping to POCSO Act 2012 (§11–§19) and IT Act 2000 (§67B, §66E, §67, §66C/D)"
    - "10-step evidence preservation checklist that avoids re-exposure of harmful content"
    - "Auto-filled CyberTipline / cybercrime.gov.in style report downloadable as Markdown or PDF, with 5 one-click synthetic demo cases"

  tech_stack:
    languages: ["Python"]
    frameworks: ["Streamlit"]
    ibm_technologies: ["IBM Bob"]
    databases: []
    other: ["reportlab", "Python re (regex)", "Python dataclasses"]

  what_we_are_most_proud_of: >
    The evidence preservation workflow and the legal mapping engine. We designed the tool so that
    a non-technical parent or teacher can go from "I found something concerning" to a legally
    referenced, court-ready incident report in under 60 seconds — without ever re-opening the
    original content. The POCSO + IT Act §67B mapping with penalty details is rare in consumer
    safety tools and gives child-protection workers immediate legal grounding.

  known_limitations: >
    Analysis is regex/pattern-based (no LLM); it can produce false positives on innocent text
    containing trigger words in non-harmful contexts. PDF rendering is basic — a production version
    would use a proper template engine. The tool is English-only and India-specific in its legal
    references. No authentication or audit logging is implemented in this MVP.

